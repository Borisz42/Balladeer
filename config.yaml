hardware:
  device: "cuda:0"
  max_vram_gb: 8.0
  pinned_ram_gb: 12.0
  enable_pinned_memory: true

indexing:
  local_model: "qwen2.5-vl-3b"
  vlm_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  vlm_display_name: "Qwen 2.5 VL (3B)"
  vlm_quant: "nf4"
  quality_threshold: 6.0
  scene_detection_threshold: 0.3
  siglip_model: "google/siglip2-base-patch16-224"
  video_shot_window_sec: 3
  fallback_to_heuristic: true
  batch_size: 8
  max_parallel_workers: 4

google_ai:
  api_key: ""
  only_local_ai: false
  batch_size: 20
  enable_cloud_waterfall: true

audio:
  music_model: "infosave/MiniMax-Music-3-cmf"
  cmf_filename: "minimax-music3-q4tp.cmf"
  sample_rate: 32000
  beat_snap_tolerance_sec: 0.25
  default_tempo_bpm: 120.0
  demucs_model: "htdemucs"
  alignment_model: "MMS_FA"
  enable_local_synthesis: false

comfyui:
  host: "127.0.0.1"
  port: 8188
  auto_launch: false
  model_path: "data/weights/minimax-music3/minimax-music3-q4tp.cmf"

video:
  resolution: [1920, 1080]
  fps: 30
  photo_beat_range: [1, 3]
  video_beat_range: [2, 5]
  default_bg_mode: "blurred_fill" # Options: "blurred_fill", "black_bars", "ken_burns_zoom"
  enable_ken_burns: false
  blur_radius: 25
  blur_scale: 1.25
  nvenc_preset: "p6"
  video_codec: "h264_nvenc" # Fallback: "libx264"
  audio_bitrate: "320k"

huggingface:
  api_key: ""
  vlm_model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  siglip_model_id: "google/siglip2-base-patch16-224"
