[pytest]
testpaths = tests
pythonpath = .
norecursedirs = ComfyUI .venv venv data uploads output .git
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
